# Publishes a GitHub Release with the APK (car-dashboard.apk) for each version tag, e.g. v0.8.
# Pushing a tag releases it; "Run workflow" (with a tag) releases an older tag, whose code has no copy of this file.
# Every APK is signed with the one release key from the repository secrets, so each version installs over the last:
#   RELEASE_KEYSTORE_BASE64 (the keystore, base64), RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to release (e.g. v0.3)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Version from the tag
        run: |
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]] || { echo "::error::Tag $TAG is not vMAJOR.MINOR[.PATCH]"; exit 1; }
          echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + ${BASH_REMATCH[4]:-0} ))" >> "$GITHUB_ENV"
      - name: Test, lint and build
        run: ./gradlew --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" testReleaseUnitTest lintRelease assembleRelease
      - name: Sign with the release key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || { echo "::error::The RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" --key-pass env:RELEASE_KEY_PASSWORD \
            --out car-dashboard.apk app/build/outputs/apk/release/app-release.apk
          rm "$RUNNER_TEMP/release.keystore"
          "$APKSIGNER" verify --print-certs car-dashboard.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # "Latest" (the README's download link) is only ever the highest version tag.
          NEWEST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          LATEST=false; [ "$TAG" = "$NEWEST" ] && LATEST=true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" car-dashboard.apk --clobber
          else
            gh release create "$TAG" car-dashboard.apk --verify-tag --title "$TAG" \
              --notes "$(git log -1 --format=%s "$TAG")" --latest="$LATEST"
          fi
