# Builds Car Dashboard, runs its unit tests and lint on every push and pull request, and keeps the APK.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Test, lint and build
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: car-dashboard-apk
          path: app/build/outputs/apk/release/*.apk
