plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prajwal.cardashboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.prajwal.cardashboard'
        minSdk 26
        targetSdk 34
        // Release builds (.github/workflows/release.yml) pass both from the tag: v0.8 -> versionName 0.8, versionCode 800.
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        // Local builds: a date-and-time stamp after the version, shown in Dashboard settings, to tell builds apart.
        versionName project.findProperty('versionName') ?:
            '1.0.' + java.time.LocalDateTime.now().format(java.time.format.DateTimeFormatter.ofPattern('yyMMdd.HHmm'))
        // ARM only (head units and phones): leaves MapLibre's native engine for x86 out of the APK.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installed by hand (no store): signed with the debug key, so a release installs over a debug build.
            // For a store or shared releases, sign with your own key, kept out of the repository.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata from AndroidX's dependencies; this app is plain Java and never reads it.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // The maps (DashboardMap, NavigationActivity): MapLibre drawing OpenFreeMap's vector tiles. BSD 2-Clause.
    implementation 'org.maplibre.gl:android-sdk:11.8.0'
    // HTTP for MapLibre, place search and routing. Apache 2.0.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Tests only, never in the APK: plain JVM tests (src/test).
    testImplementation 'junit:junit:4.13.2'
}
